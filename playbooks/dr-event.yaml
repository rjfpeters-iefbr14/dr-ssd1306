# The SO starts, changes and ends a DR event on the dr-ssd1306 OLED through
# SP01, unattended. Each limit below the 5.0 kW baseline asks for the
# difference as the requested reduction and starts the event again; the
# OLED's power stays the simulated demand (3.2 kW by default). SP01 runs
# model_1.py (cp1) with the display_ssd1306 plugin. From the rti-demo:
#
#   cd examples/rti-demo
#   uv run python -m playbooks.run /path/to/dr-ssd1306/playbooks/dr-event.yaml
#
# Setup: playbooks/README.md.

name: DR event on the SSD1306 OLED
bff: http://localhost:3000
pace: 2s

steps:
  - label: SP01 dials the SO
    link: {fsp: SP01}
    expect: {linked: [SP01]}

  - label: Reporting off to start with
    disable-report: {fsp: SP01, rcb: LD0/LLN0.rcbActualValues, type: URCB}
  - disable-report: {fsp: SP01, rcb: LD0/LLN0.rcbSetpoints, type: URCB}
  - label: No event on the OLED to start with
    operate: {fsp: SP01, ref: LD0/DWMX1.WMaxSpt, cdc: APC, value: 6000}

  - label: SP01 reports the OLED's power and applied limit
    enable-report: {fsp: SP01, rcb: LD0/LLN0.rcbActualValues, type: URCB}
  - enable-report: {fsp: SP01, rcb: LD0/LLN0.rcbSetpoints, type: URCB}
  - wait: 3s
    expect: {reports: {fsp: SP01, min: 1}}

  # The power drops from the baseline to the demand, the applied limit to
  # the SO's limit: both are reported.
  - label: SO asks for a 3.0 kW limit - the OLED asks for 2.0 kW less
    operate: {fsp: SP01, ref: LD0/DWMX1.WMaxSpt, cdc: APC, value: 3000}
  - wait: 4s
    expect: {reports: {fsp: SP01, min: 1}}
  - label: The applied limit is the SO's (3000 W)
    read: {fsp: SP01, ref: LD0/DWMX1.WMaxSpt.mxVal.f, fc: mx}

  - label: SO lowers the limit to 2.5 kW - the event starts again
    operate: {fsp: SP01, ref: LD0/DWMX1.WMaxSpt, cdc: APC, value: 2500}
  - wait: 4s
    expect: {reports: {fsp: SP01, min: 1}}

  - label: SO ends the event - the OLED shows it done
    operate: {fsp: SP01, ref: LD0/DWMX1.WMaxSpt, cdc: APC, value: 6000}
  - wait: 3s
    expect: {reports: {fsp: SP01, min: 1}}
  - label: Back at the baseline (5000 W)
    read: {fsp: SP01, ref: LD0/MMXU1.TotW.mag.f, fc: mx}

  - label: SP01 stops reporting
    disable-report: {fsp: SP01, rcb: LD0/LLN0.rcbActualValues, type: URCB}
  - disable-report: {fsp: SP01, rcb: LD0/LLN0.rcbSetpoints, type: URCB}
